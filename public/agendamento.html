<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Agendamento do Teste de Aptidão Física — HNMD" />
  <title>Agendamento TAF — HNMD</title>
  <link rel="icon" href="./favicon.png" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Credenciais injetadas pelo CI via scripts/patch-web-dist.mjs -->
  <script>
    window.__AGENDAMENTO_CFG__ = {
      url: "__SUPABASE_URL__",
      key: "__SUPABASE_KEY__",
      build: "__BUILD_ID__"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0f172a;
      --navy-2:    #1e293b;
      --navy-3:    #334155;
      --gold:      #d4af37;
      --gold-dark: #b8941c;
      --text:      #f1f5f9;
      --text-2:    #cbd5e1;
      --text-m:    #94a3b8;
      --green:     #22c55e;
      --green-bg:  rgba(34,197,94,.12);
      --red:       #ef4444;
      --red-bg:    rgba(239,68,68,.10);
      --yellow-bg: rgba(212,175,55,.10);
      --r:         14px;
      --r-sm:      8px;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1a2742 50%, #0f172a 100%);
      color: var(--text);
      min-height: 100%;
    }

    .app { max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }

    /* ── Header ─────────────────────────────────────────────────── */
    .header { display: flex; align-items: center; gap: 12px; padding: 28px 0 22px; }

    .back-btn {
      width: 40px; height: 40px; border: none;
      background: var(--navy-2); border-radius: var(--r-sm);
      cursor: pointer; display: none; align-items: center; justify-content: center;
      color: var(--text); font-size: 20px; flex-shrink: 0; transition: background .15s;
    }
    .back-btn:hover { background: var(--navy-3); }
    .back-btn.visible { display: flex; }

    .brand { display: flex; align-items: center; gap: 12px; flex: 1; }

    .brand-badge {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 22px; font-weight: 900;
      color: var(--navy); flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(212,175,55,.35);
    }

    .header-title { font-size: 21px; font-weight: 800; color: var(--gold); line-height: 1.2; }
    .header-sub   { font-size: 13px; color: var(--text-m); margin-top: 2px; }

    /* ── Steps ──────────────────────────────────────────────────── */
    #stepsBar { display: flex; align-items: center; margin-bottom: 24px; }

    .step-item { display: flex; align-items: center; flex: 1; }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,.15); flex-shrink: 0; transition: background .25s;
    }
    .step-dot.active { background: var(--gold); }
    .step-dot.done   { background: var(--green); }
    .step-line {
      flex: 1; height: 2px; background: rgba(255,255,255,.1);
      margin: 0 4px; transition: background .25s;
    }
    .step-line.done { background: var(--green); }

    /* ── Section ────────────────────────────────────────────────── */
    .section-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 5px; }
    .section-sub   { font-size: 14px; color: var(--text-m); margin-bottom: 18px; line-height: 1.4; }

    /* ── Cards clicáveis ────────────────────────────────────────── */
    .card {
      background: var(--navy-2); border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--r); padding: 15px 16px; margin-bottom: 10px;
      cursor: pointer; display: flex; align-items: center; gap: 13px;
      transition: border-color .2s, transform .12s; -webkit-tap-highlight-color: transparent;
    }
    .card:hover  { border-color: var(--gold); }
    .card:active { transform: scale(.98); }

    .card-emoji { font-size: 24px; flex-shrink: 0; }
    .card-texts { flex: 1; }
    .card-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .card-sub   { font-size: 13px; color: var(--text-m); margin-top: 3px; }
    .card-arrow { color: var(--text-m); font-size: 20px; flex-shrink: 0; }

    .badge {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; flex-shrink: 0;
    }
    .badge-green { background: var(--green-bg); color: var(--green); }

    /* ── Empty state ────────────────────────────────────────────── */
    .empty {
      background: var(--navy-2); border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--r); padding: 40px 20px; text-align: center;
    }
    .empty-icon { font-size: 44px; margin-bottom: 14px; opacity: .7; }
    .empty-text { color: var(--text-m); font-size: 15px; line-height: 1.6; }

    /* ── Formulário ─────────────────────────────────────────────── */
    .field-label {
      display: block; font-size: 11px; font-weight: 800;
      letter-spacing: .5px; text-transform: uppercase;
      color: var(--text-m); margin: 16px 0 6px;
    }
    .field-label:first-child { margin-top: 0; }

    input[type="text"], input[type="tel"] {
      width: 100%; background: var(--navy-2);
      border: 1px solid rgba(255,255,255,.12); border-radius: var(--r-sm);
      padding: 13px 14px; font-size: 16px; color: var(--text);
      outline: none; transition: border-color .2s; -webkit-appearance: none;
    }
    input:focus   { border-color: var(--gold); }
    input::placeholder { color: var(--text-m); }
    .nip-input { font-size: 24px !important; text-align: center; letter-spacing: 4px; font-weight: 700; }

    .feedback {
      font-size: 13px; font-weight: 600; text-align: center;
      padding: 9px 12px; border-radius: var(--r-sm); margin-top: 8px; line-height: 1.4;
    }
    .feedback-ok  { color: var(--green); background: var(--green-bg); }
    .feedback-err { color: var(--red);   background: var(--red-bg);   }

    .cadastro-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .hint-sexo {
      font-size: 12px;
      color: #fbbf24;
      margin: 6px 0 10px;
      line-height: 1.45;
      background: rgba(251,191,36,.08);
      border: 1px solid rgba(251,191,36,.25);
      border-radius: var(--r-sm);
      padding: 10px 12px;
    }
    .toggle-row, .chip-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px;
      padding: 4px; border-radius: var(--r-sm);
    }
    .toggle-btn, .chip {
      border: 1px solid rgba(255,255,255,.12);
      background: var(--navy-2);
      color: var(--text);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
    }
    .toggle-btn { flex: 1; text-align: center; }
    .toggle-btn.active, .chip.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0f172a;
      border-color: var(--gold);
    }
    .field-blink {
      animation: blinkOrange 1s ease-in-out infinite;
      border-color: #f97316 !important;
      box-shadow: 0 0 0 2px rgba(249,115,22,.35);
    }
    .toggle-row.field-blink, .chip-row.field-blink {
      outline: 2px solid #f97316;
      box-shadow: 0 0 0 2px rgba(249,115,22,.25);
    }
    @keyframes blinkOrange {
      0%, 100% { box-shadow: 0 0 0 2px rgba(249,115,22,.2); }
      50% { box-shadow: 0 0 0 5px rgba(249,115,22,.55); }
    }

    /* ── Resumo ─────────────────────────────────────────────────── */
    .summary-card {
      background: var(--navy-2); border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--r); padding: 16px; margin-bottom: 10px;
    }
    .summary-label { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text-m); margin-bottom: 5px; }
    .summary-value { font-size: 16px; font-weight: 700; color: var(--text); }
    .summary-sub   { font-size: 13px; color: var(--text-m); margin-top: 3px; }

    /* ── Botões ──────────────────────────────────────────────────── */
    .btn {
      width: 100%; padding: 15px; border: none; border-radius: var(--r);
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .2s, transform .12s; -webkit-tap-highlight-color: transparent;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0f172a; box-shadow: 0 4px 14px rgba(212,175,55,.3);
    }
    .btn-primary:hover:not(:disabled) { opacity: .9; }
    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff; box-shadow: 0 4px 14px rgba(34,197,94,.25);
    }
    .btn-outline { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }

    /* ── Loading ────────────────────────────────────────────────── */
    .loading { display: flex; flex-direction: column; align-items: center; padding: 64px 0; gap: 16px; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-m); font-size: 14px; }

    /* ── Sucesso ────────────────────────────────────────────────── */
    .success-wrap {
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 0; text-align: center;
    }
    .success-icon   { font-size: 78px; line-height: 1; margin-bottom: 22px; }
    .success-title  { font-size: 26px; font-weight: 800; color: var(--green); margin-bottom: 10px; }
    .success-name   { font-size: 16px; color: var(--text-2); margin-bottom: 5px; }
    .success-detail { font-size: 15px; color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app" id="app">

    <div class="header" id="pageHeader">
      <button class="back-btn" id="backBtn" onclick="app.voltar()" aria-label="Voltar">&#8592;</button>
      <div class="brand">
        <div class="brand-badge">T</div>
        <div>
          <div class="header-title">Agendamento TAF</div>
          <div class="header-sub" id="headerSub">Inscreva-se na sua modalidade</div>
        </div>
      </div>
    </div>

    <div id="stepsBar">
      <div class="step-item"><div class="step-dot active" id="dot0"></div><div class="step-line" id="line0"></div></div>
      <div class="step-item"><div class="step-dot" id="dot1"></div><div class="step-line" id="line1"></div></div>
      <div class="step-item"><div class="step-dot" id="dot2"></div><div class="step-line" id="line2"></div></div>
      <div class="step-item"><div class="step-dot" id="dot3"></div></div>
    </div>

    <div id="content"></div>

  </div>

  <script>
  (function () {
    'use strict';

    var cfg = window.__AGENDAMENTO_CFG__ || {};
    function credenciaisOk(url, key) {
      if (!url || !key) return false;
      var u = String(url).trim();
      var k = String(key).trim();
      if (!u || !k) return false;
      if (u.indexOf('__SUPABASE') !== -1 || k.indexOf('__SUPABASE') !== -1) return false;
      if (u.indexOf('http') !== 0) return false;
      return k.length >= 20;
    }
    var URL_SB = credenciaisOk(cfg.url, cfg.key) ? String(cfg.url).trim() : '';
    var KEY_SB = credenciaisOk(cfg.url, cfg.key) ? String(cfg.key).trim() : '';

    var LABEL = {
      corrida:'Corrida', natacao_permanencia:'Natação + Permanência',
      caminhada:'Caminhada', flexao_barra:'Flexão de Barra (CFN)',
      flexao_solo:'Flexão de Solo (CFN)', abdominal_remador:'Abdominal Remador (CFN)',
      abdominal_prancha:'Abdominal Prancha (CFN)',
    };
    var ICON = {
      corrida:'🏃', natacao_permanencia:'🏊', caminhada:'🚶',
      flexao_barra:'💪', flexao_solo:'🤸', abdominal_remador:'🚣', abdominal_prancha:'🧘',
    };

    var GRADUACOES_PRACAS = ['MN', 'CB', '3°SG', '2°SG', '1°SG', 'SO', 'SD'];
    var POSTOS_OFICIAIS = ['GM', '2°TEN', '1°TEN', 'CT', 'CC', 'CF', 'CMG', 'CALTE'];

    var sb, etapa = 'data', slots = [], reservasMap = {};
    var dataSel = null, slotSel = null, nipVal = '';
    var nipBuscaTimer = null;
    var nipBuscaSeq = 0;
    /** 'idle' | 'completo' | 'incompleto' | 'novo' */
    var cadastroModo = 'idle';
    var form = {
      nome: '',
      dataNascimento: '',
      sexo: '',
      categoria: 'Praças',
      posto: 'MN',
      vinculo: 'carreira',
    };
    var camposFaltando = {};
    var feedbackMsg = '';
    var feedbackTipo = 'ok';

    function limparFormularioCadastro() {
      form = { nome: '', dataNascimento: '', sexo: '', categoria: 'Praças', posto: 'MN', vinculo: 'carreira' };
      camposFaltando = {};
      cadastroModo = 'idle';
      feedbackMsg = '';
      feedbackTipo = 'ok';
    }

    function formatarDataInput(raw) {
      var d = String(raw || '').replace(/\D/g, '').slice(0, 8);
      if (d.length <= 2) return d;
      if (d.length <= 4) return d.slice(0, 2) + '/' + d.slice(2);
      return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
    }

    function dataNascValida(v) { return /^\d{2}\/\d{2}\/\d{4}$/.test(String(v || '').trim()); }

    function nomeExibicao() {
      var nome = String(form.nome || '').trim().toUpperCase();
      var posto = String(form.posto || '').trim().toUpperCase();
      var vinculo = String(form.vinculo || '').toLowerCase() === 'rm2' ? ' RM2' : '';
      if (posto && nome) return (posto + vinculo + ' ' + nome).trim();
      return nome;
    }

    function calcularFaltando(blink) {
      var f = {};
      if (!String(form.nome || '').trim() || String(form.nome).trim().length < 3) f.nome = true;
      if (!dataNascValida(form.dataNascimento)) f.dataNascimento = true;
      if (form.sexo !== 'M' && form.sexo !== 'F') f.sexo = true;
      if (form.categoria !== 'Oficiais' && form.categoria !== 'Praças') f.categoria = true;
      if (!String(form.posto || '').trim()) f.posto = true;
      if (form.vinculo !== 'carreira' && form.vinculo !== 'rm2') f.vinculo = true;
      camposFaltando = blink ? f : {};
      return f;
    }

    function cadastroCompleto() {
      var f = calcularFaltando(false);
      return Object.keys(f).length === 0;
    }

    function aplicarCadastroDaBusca(row) {
      form.nome = String(row.nome || '').trim().toUpperCase();
      form.dataNascimento = String(row.data_nascimento || '').trim();
      form.sexo = (row.sexo === 'M' || row.sexo === 'F') ? row.sexo : '';
      form.categoria = (row.categoria === 'Oficiais' || row.categoria === 'Praças') ? row.categoria : 'Praças';
      form.posto = String(row.posto || '').trim().toUpperCase() || (form.categoria === 'Oficiais' ? 'GM' : 'MN');
      form.vinculo = (row.vinculo === 'carreira' || row.vinculo === 'rm2') ? row.vinculo : '';
      var faltando = calcularFaltando(true);
      if (Object.keys(faltando).length === 0) {
        cadastroModo = 'completo';
        camposFaltando = {};
        setFeedbackIdent('Militar encontrado: ' + nomeExibicao(), 'ok');
      } else {
        cadastroModo = 'incompleto';
        setFeedbackIdent('Cadastro incompleto. Complete os campos em destaque (laranja).', 'err');
      }
    }

    function abrirCadastroNovo() {
      limparFormularioCadastro();
      cadastroModo = 'novo';
      form.categoria = 'Praças';
      form.posto = 'MN';
      form.vinculo = 'carreira';
      camposFaltando = {};
      setFeedbackIdent('NIP não encontrado. Preencha seus dados para continuar.', 'err');
    }

    function limparCacheApp() {
      var jobs = [];
      if (typeof caches !== 'undefined' && caches.keys) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {}));
      }
      if (typeof navigator !== 'undefined' && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {}));
      }
      return Promise.all(jobs);
    }

    function forcarRecarregarRede() {
      try {
        if (sessionStorage.getItem('agendamento_force_reload') === '1') return false;
        sessionStorage.setItem('agendamento_force_reload', '1');
      } catch (e) { /* ignore */ }
      var base = location.pathname.indexOf('.html') >= 0
        ? location.pathname
        : (location.pathname.replace(/\/?$/, '/') + '').replace(/\/agendamento\/?$/, '/agendamento.html');
      if (base.indexOf('agendamento.html') < 0) {
        base = (location.pathname.split('/apptaf')[0] || '') + '/apptaf/agendamento.html';
      }
      location.replace(base + '?nocache=' + Date.now());
      return true;
    }

    function init() {
      mostrarLoading();
      limparCacheApp().finally(function () {
        cfg = window.__AGENDAMENTO_CFG__ || {};
        URL_SB = credenciaisOk(cfg.url, cfg.key) ? String(cfg.url).trim() : '';
        KEY_SB = credenciaisOk(cfg.url, cfg.key) ? String(cfg.key).trim() : '';

        if (!URL_SB || !KEY_SB) {
          if (forcarRecarregarRede()) return;
          mostrarErroCfg(
            'Credenciais ausentes neste navegador (cache antigo). Abra em aba anônima: ' +
            'https://thiagod11lopes-ops.github.io/apptaf/agendamento.html' +
            ' — build=' + (cfg.build || '?') +
            ' url=' + (cfg.url || '(vazio)')
          );
          return;
        }
        try { sessionStorage.removeItem('agendamento_force_reload'); } catch (e) {}

        var lib = (typeof supabase !== 'undefined' && supabase) || window.supabase;
        if (!lib || typeof lib.createClient !== 'function') {
          mostrarErro('Não foi possível carregar a biblioteca do Supabase. Verifique a conexão e tente novamente.');
          return;
        }
        try {
          sb = lib.createClient(URL_SB, KEY_SB);
        } catch (err) {
          mostrarErro('Falha ao iniciar conexão: ' + ((err && err.message) || 'erro desconhecido'));
          return;
        }
        carregarDados();
      });
    }

    function brParaIso(br) {
      if (!br) return null;
      var p = br.split('/');
      if (p.length !== 3 || p[2].length !== 4) return null;
      return p[2] + '-' + p[1].padStart(2,'0') + '-' + p[0].padStart(2,'0');
    }
    function hojeIso() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    async function carregarDados() {
      try {
        var hoje = hojeIso();
        var r1 = await sb.from('agendamento_slots').select('*').eq('deleted', false);
        if (r1.error) throw r1.error;
        slots = (r1.data || []).filter(function(s) { var iso = brParaIso(s.data_taf); return iso && iso >= hoje; })
          .sort(function(a,b) { var ia=brParaIso(a.data_taf)||'',ib=brParaIso(b.data_taf)||''; return ia<ib?-1:ia>ib?1:a.modalidade.localeCompare(b.modalidade); });
        var r2 = await sb.from('agendamento_reservas').select('slot_id').eq('deleted', false);
        if (r2.error) throw r2.error;
        reservasMap = {};
        (r2.data||[]).forEach(function(r) { reservasMap[r.slot_id] = (reservasMap[r.slot_id]||0)+1; });
        etapa = 'data'; render();
      } catch(e) { mostrarErro('Erro ao carregar disponibilidade. Verifique sua conexão e tente novamente.'); }
    }

    function vagas(s) { return Math.max(0, s.max_participantes - (reservasMap[s.id]||0)); }

    function formatarNip(raw) {
      var d = raw.replace(/\D/g,'').slice(0,8);
      if (d.length<=2) return d;
      if (d.length<=6) return d.slice(0,2)+'.'+d.slice(2);
      return d.slice(0,2)+'.'+d.slice(2,6)+'.'+d.slice(6);
    }
    function nipDigitos(fmt) { return fmt.replace(/\D/g,''); }

    function render() {
      atualizarHeader(); atualizarSteps();
      var c = document.getElementById('content');
      document.getElementById('stepsBar').style.display = 'flex';
      if      (etapa==='data')        c.innerHTML = telaData();
      else if (etapa==='modalidade')  c.innerHTML = telaModalidade();
      else if (etapa==='identificar') c.innerHTML = telaIdentificar();
      else if (etapa==='confirmar')   c.innerHTML = telaConfirmar();
      else if (etapa==='sucesso') { document.getElementById('stepsBar').style.display='none'; c.innerHTML=telaSucesso(); }
      if (etapa==='identificar') {
        var ni=document.getElementById('nipInput');
        if(ni){ni.value=nipVal;ni.focus();}
        sincronizarFormularioNaTela();
        atualizarBtnContinuar();
      }
    }

    function atualizarHeader() {
      var btn=document.getElementById('backBtn'), sub=document.getElementById('headerSub');
      if(btn) btn.classList.toggle('visible', etapa!=='data'&&etapa!=='sucesso');
      var subs={data:'Inscreva-se na sua modalidade',modalidade:dataSel||'',identificar:'Identificação do militar',confirmar:'Confirme sua inscrição',sucesso:'Inscrição realizada'};
      if(sub) sub.textContent=subs[etapa]||'';
    }

    function atualizarSteps() {
      var ordem=['data','modalidade','identificar','confirmar'], atual=ordem.indexOf(etapa);
      for(var i=0;i<4;i++){
        var dot=document.getElementById('dot'+i),line=document.getElementById('line'+i);
        if(!dot) continue;
        dot.className='step-dot';
        if(i<atual) dot.classList.add('done'); else if(i===atual) dot.classList.add('active');
        if(line){line.className='step-line'; if(i<atual) line.classList.add('done');}
      }
    }

    function telaData() {
      var datas=[],visto=Object.create(null);
      slots.forEach(function(s){if(!visto[s.data_taf]&&vagas(s)>0){visto[s.data_taf]=true;datas.push(s.data_taf);}});
      var h='<p class="section-title">Datas disponíveis</p><p class="section-sub">Selecione a data que deseja realizar o TAF.</p>';
      if(!datas.length) return h+'<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Não há datas disponíveis no momento.<br>Aguarde a abertura das inscrições.</div></div>';
      datas.forEach(function(d){
        var grupo=slots.filter(function(s){return s.data_taf===d&&vagas(s)>0;});
        var tv=grupo.reduce(function(a,s){return a+vagas(s);},0), nm=grupo.length;
        h+='<div class="card" onclick="app.selecionarData(\''+e(d)+'\')">'+'<span class="card-emoji">📅</span>'+'<div class="card-texts"><div class="card-title">'+e(d)+'</div><div class="card-sub">'+nm+' modalidade'+(nm!==1?'s':'')+' &middot; '+tv+' vaga'+(tv!==1?'s':'')+'</div></div>'+'<span class="card-arrow">&#8250;</span></div>';
      });
      return h;
    }

    function telaModalidade() {
      var grupo=slots.filter(function(s){return s.data_taf===dataSel&&vagas(s)>0;});
      var h='<p class="section-title">Modalidade</p><p class="section-sub">'+e(dataSel)+' &mdash; Escolha a modalidade que irá realizar.</p>';
      grupo.forEach(function(s){
        var d=vagas(s), label=LABEL[s.modalidade]||s.modalidade, icon=ICON[s.modalidade]||'🏋';
        h+='<div class="card" onclick="app.selecionarSlot(\''+e(s.id)+'\')"><span class="card-emoji">'+icon+'</span><div class="card-texts"><div class="card-title">'+e(label)+'</div><div class="card-sub">'+d+' vaga'+(d!==1?'s':'')+' disponív'+(d!==1?'eis':'el')+' &middot; máx. '+s.max_participantes+'</div></div><span class="badge badge-green">'+d+'</span></div>';
      });
      return h;
    }

    function blinkClass(campo) {
      return (cadastroModo === 'incompleto' && camposFaltando[campo]) ? ' field-blink' : '';
    }

    function togglesHtml(campo, opcoes) {
      var h = '<div class="toggle-row' + blinkClass(campo) + '" id="row_' + campo + '">';
      opcoes.forEach(function(o) {
        var ativo = form[campo] === o.v ? ' active' : '';
        h += '<button type="button" class="toggle-btn' + ativo + '" onclick="app.setCampo(\'' + campo + '\',\'' + o.v + '\')">' + e(o.l) + '</button>';
      });
      return h + '</div>';
    }

    function chipsPostoHtml() {
      var lista = form.categoria === 'Oficiais' ? POSTOS_OFICIAIS : GRADUACOES_PRACAS;
      var h = '<div class="chip-row' + blinkClass('posto') + '" id="row_posto">';
      lista.forEach(function(p) {
        var ativo = form.posto === p ? ' active' : '';
        h += '<button type="button" class="chip' + ativo + '" onclick="app.setCampo(\'posto\',\'' + p.replace(/'/g, '') + '\')">' + e(p) + '</button>';
      });
      return h + '</div>';
    }

    function formularioCadastroHtml() {
      if (cadastroModo !== 'novo' && cadastroModo !== 'incompleto') return '';
      return '<div class="cadastro-box" id="cadastroBox">'
        + '<label class="field-label" for="nomeInput">Nome completo</label>'
        + '<input id="nomeInput" type="text" class="' + blinkClass('nome').trim() + '" placeholder="NOME COMPLETO" autocomplete="off" style="text-transform:uppercase" oninput="app.onNome(this.value)" />'
        + '<label class="field-label" for="dnInput">Data de nascimento</label>'
        + '<input id="dnInput" type="tel" class="' + blinkClass('dataNascimento').trim() + '" placeholder="DD/MM/AAAA" inputmode="numeric" autocomplete="off" oninput="app.onDataNasc(this.value)" />'
        + '<label class="field-label">Sexo</label>'
        + '<div class="hint-sexo"><strong>Atenção:</strong> selecione o gênero correto (Masculino ou Feminino). Essa informação é usada nas tabelas de avaliação do TAF.</div>'
        + togglesHtml('sexo', [{v:'M',l:'Masculino'},{v:'F',l:'Feminino'}])
        + '<label class="field-label">Categoria</label>'
        + togglesHtml('categoria', [{v:'Praças',l:'Praças'},{v:'Oficiais',l:'Oficiais'}])
        + '<label class="field-label">Posto / Graduação</label>'
        + chipsPostoHtml()
        + '<label class="field-label">Vínculo</label>'
        + togglesHtml('vinculo', [{v:'carreira',l:'Quadro'},{v:'rm2',l:'RM2'}])
        + '</div>';
    }

    function sincronizarFormularioNaTela() {
      var nm = document.getElementById('nomeInput');
      var dn = document.getElementById('dnInput');
      if (nm) nm.value = form.nome || '';
      if (dn) dn.value = form.dataNascimento || '';
    }

    function setFeedbackIdent(msg, tipo) {
      feedbackMsg = msg || '';
      feedbackTipo = tipo || 'ok';
      var el = document.getElementById('feedbackIdent');
      if (!el) return;
      if (!feedbackMsg) { el.style.display = 'none'; el.textContent = ''; return; }
      el.style.display = 'block';
      el.className = 'feedback feedback-' + feedbackTipo;
      el.textContent = feedbackMsg;
    }

    async function buscarNomePorNip(nipFmt) {
      var digits = nipDigitos(nipFmt);
      if (!sb || digits.length < 8) return;
      var seq = ++nipBuscaSeq;
      setFeedbackIdent('Buscando cadastro...', 'ok');
      try {
        var res = await sb.rpc('buscar_militar_agendamento', { p_nip: digits });
        if (seq !== nipBuscaSeq) return;
        if (res.error) {
          abrirCadastroNovo();
          setFeedbackIdent('Não foi possível consultar o cadastro. Preencha seus dados.', 'err');
          render();
          return;
        }
        var row = (res.data && res.data[0]) || null;
        if (row && String(row.nome || '').trim()) {
          aplicarCadastroDaBusca(row);
        } else {
          abrirCadastroNovo();
        }
        render();
      } catch (err) {
        if (seq !== nipBuscaSeq) return;
        abrirCadastroNovo();
        setFeedbackIdent('Não foi possível consultar o cadastro. Preencha seus dados.', 'err');
        render();
      }
    }

    function telaIdentificar() {
      var sub = 'Informe seu NIP. Se estiver cadastrado, os dados serão preenchidos automaticamente.';
      if (cadastroModo === 'novo') sub = 'NIP não encontrado. Preencha todos os campos do cadastro.';
      if (cadastroModo === 'incompleto') sub = 'Há dados faltando no cadastro. Complete os campos em laranja.';
      return '<p class="section-title">Identificação</p><p class="section-sub">' + sub + '</p>'
        +'<label class="field-label" for="nipInput">NIP</label>'
        +'<input id="nipInput" type="tel" class="nip-input" placeholder="00.0000.00" autocomplete="off" inputmode="numeric" oninput="app.onNip(this.value)" />'
        +(cadastroModo === 'completo'
          ? ('<div class="summary-card" style="margin-top:12px"><div class="summary-label">Militar</div><div class="summary-value">' + e(nomeExibicao()) + '</div></div>')
          : '')
        +'<div id="feedbackIdent" class="feedback' + (feedbackMsg ? (' feedback-' + feedbackTipo) : '') + '" style="' + (feedbackMsg ? '' : 'display:none') + '">' + e(feedbackMsg) + '</div>'
        + formularioCadastroHtml()
        +'<button class="btn btn-primary" id="btnContinuar" onclick="app.avancarConfirmar()" disabled>Continuar &#8250;</button>';
    }

    function atualizarBtnContinuar() {
      var btn=document.getElementById('btnContinuar');
      if(!btn) return;
      var okNip = nipDigitos(nipVal).length >= 8;
      if (cadastroModo === 'completo') {
        btn.disabled = !okNip || !cadastroCompleto();
        return;
      }
      if (cadastroModo === 'novo' || cadastroModo === 'incompleto') {
        btn.disabled = !okNip || !cadastroCompleto();
        return;
      }
      btn.disabled = true;
    }

    function telaConfirmar() {
      var label=slotSel?(LABEL[slotSel.modalidade]||slotSel.modalidade):'—';
      var sexoLabel = form.sexo === 'F' ? 'Feminino' : form.sexo === 'M' ? 'Masculino' : '—';
      var vinculoLabel = form.vinculo === 'rm2' ? 'RM2' : 'Quadro';
      return '<p class="section-title">Confirmar inscrição</p><p class="section-sub">Verifique seus dados antes de confirmar.</p>'
        +'<div class="summary-card"><div class="summary-label">Prova</div><div class="summary-value">'+e(label)+'</div><div class="summary-sub">'+e(slotSel?slotSel.data_taf:'—')+'</div></div>'
        +'<div class="summary-card"><div class="summary-label">Militar</div><div class="summary-value">'+e(nomeExibicao())+'</div>'
        +'<div class="summary-sub">NIP '+e(nipVal)+' · '+e(sexoLabel)+' · Nasc. '+e(form.dataNascimento||'—')+'</div>'
        +'<div class="summary-sub">'+e(form.categoria||'')+' · '+e(form.posto||'')+' · '+e(vinculoLabel)+'</div></div>'
        +'<div id="erroCfm" class="feedback feedback-err" style="display:none"></div>'
        +'<button class="btn btn-success" id="btnConfirmar" onclick="app.confirmar()">&#10003; Confirmar inscrição</button>';
    }

    function telaSucesso() {
      var label=slotSel?(LABEL[slotSel.modalidade]||slotSel.modalidade):'';
      return '<div class="success-wrap"><div class="success-icon">&#9989;</div><div class="success-title">Inscrição confirmada!</div><div class="success-name">'+e(nomeExibicao())+'</div><div class="success-detail">'+e(label)+' &middot; '+e(slotSel?slotSel.data_taf:'')+'</div>'
        +'<button class="btn btn-primary" style="max-width:300px;margin-top:28px" onclick="app.novaInscricao()">Nova inscrição</button></div>';
    }

    function mostrarErroCfg(msg) {
      document.getElementById('stepsBar').style.display='none';
      document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">⚙️</div><div class="empty-text"><strong>Página em configuração</strong><br><br>'+e(msg||'Esta página está sendo preparada pelo administrador. Tente novamente em alguns instantes.')+'</div></div><button class="btn btn-outline" style="margin-top:16px" onclick="location.reload(true)">&#8635; Recarregar sem cache</button>';
    }
    function mostrarErro(msg) {
      document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">'+e(msg)+'</div></div><button class="btn btn-outline" style="margin-top:16px" onclick="location.reload()">&#8635; Tentar novamente</button>';
    }
    function mostrarLoading() {
      document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div><div class="loading-text">Carregando disponibilidade...</div></div>';
    }

    function e(s) {
      if(s==null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    window.app = {
      selecionarData: function(d){ dataSel=d; etapa='modalidade'; render(); },
      selecionarSlot: function(id){
        slotSel=slots.find(function(s){return s.id===id;})||null;
        if(!slotSel)return;
        etapa='identificar';
        nipVal='';
        limparFormularioCadastro();
        nipBuscaSeq++;
        render();
      },
      voltar: function(){
        if(etapa==='modalidade'){etapa='data';render();}
        else if(etapa==='identificar'){etapa='modalidade';render();}
        else if(etapa==='confirmar'){etapa='identificar';render();}
      },
      onNip: function(v){
        nipVal=formatarNip(v);
        var el=document.getElementById('nipInput');
        if(el) el.value=nipVal;
        var digits=nipDigitos(nipVal);
        if (digits.length < 8) {
          if (nipBuscaTimer) { clearTimeout(nipBuscaTimer); nipBuscaTimer=null; }
          nipBuscaSeq++;
          limparFormularioCadastro();
          setFeedbackIdent('', '');
          var box=document.getElementById('cadastroBox');
          if (box) render();
          atualizarBtnContinuar();
          return;
        }
        if (nipBuscaTimer) clearTimeout(nipBuscaTimer);
        nipBuscaTimer = setTimeout(function(){ buscarNomePorNip(nipVal); }, 280);
        atualizarBtnContinuar();
      },
      onNome: function(v){
        form.nome = String(v || '').toUpperCase();
        if (cadastroModo === 'incompleto') {
          calcularFaltando(true);
          var nm = document.getElementById('nomeInput');
          if (nm) nm.className = blinkClass('nome').trim();
        }
        atualizarBtnContinuar();
      },
      onDataNasc: function(v){
        form.dataNascimento = formatarDataInput(v);
        var dn = document.getElementById('dnInput');
        if (dn) {
          dn.value = form.dataNascimento;
          if (cadastroModo === 'incompleto') {
            calcularFaltando(true);
            dn.className = blinkClass('dataNascimento').trim();
          }
        }
        atualizarBtnContinuar();
      },
      setCampo: function(campo, valor){
        if (campo === 'categoria') {
          form.categoria = valor;
          form.posto = valor === 'Oficiais' ? 'GM' : 'MN';
        } else {
          form[campo] = valor;
        }
        if (cadastroModo === 'incompleto') calcularFaltando(true);
        render();
      },
      avancarConfirmar: function(){
        if (nipDigitos(nipVal).length < 8) return;
        if (!cadastroCompleto()) {
          if (cadastroModo === 'novo') {
            setFeedbackIdent('Preencha todos os campos do cadastro.', 'err');
          } else {
            cadastroModo = 'incompleto';
            calcularFaltando(true);
            setFeedbackIdent('Complete os campos em destaque (laranja).', 'err');
            render();
          }
          return;
        }
        camposFaltando = {};
        etapa = 'confirmar';
        render();
      },
      confirmar: async function(){
        var btn=document.getElementById('btnConfirmar'), err=document.getElementById('erroCfm');
        if(btn){btn.disabled=true;btn.textContent='Salvando...';}
        if(err) err.style.display='none';
        try {
          if (!cadastroCompleto()) throw new Error('Dados do cadastro incompletos.');
          var nipKey=nipDigitos(nipVal);
          var dup=await sb.from('agendamento_reservas').select('id').eq('slot_id',slotSel.id).eq('nip',nipKey).eq('deleted',false).maybeSingle();
          if(dup.data){
            if(err){err.textContent='Você já está inscrito nesta modalidade nesta data.';err.style.display='block';}
            if(btn){btn.disabled=false;btn.innerHTML='&#10003; Confirmar inscrição';}
            return;
          }
          var salv = await sb.rpc('salvar_militar_agendamento', {
            p_nip: nipKey,
            p_nome: form.nome.trim(),
            p_data_nascimento: form.dataNascimento.trim(),
            p_sexo: form.sexo,
            p_categoria: form.categoria,
            p_posto: form.posto,
            p_vinculo: form.vinculo,
          });
          if (salv.error) throw salv.error;

          var id=Date.now()+'_'+Math.random().toString(16).slice(2,8);
          var ins=await sb.from('agendamento_reservas').insert({
            id:id,
            slot_id:slotSel.id,
            data_taf:slotSel.data_taf,
            modalidade:slotSel.modalidade,
            nip:nipKey,
            nome:nomeExibicao(),
            data_nascimento: form.dataNascimento.trim(),
            sexo: form.sexo,
            categoria: form.categoria,
            posto: form.posto,
            vinculo: form.vinculo,
            updated_at:Date.now(),
            deleted:false
          });
          if(ins.error) throw ins.error;
          etapa='sucesso'; render();
        } catch(ex){
          var msg=(ex&&ex.message)?ex.message:'Erro ao confirmar. Tente novamente.';
          if(err){err.textContent=msg;err.style.display='block';}
          if(btn){btn.disabled=false;btn.innerHTML='&#10003; Confirmar inscrição';}
        }
      },
      novaInscricao: function(){
        etapa='data'; dataSel=null; slotSel=null; nipVal='';
        limparFormularioCadastro(); nipBuscaSeq++;
        document.getElementById('stepsBar').style.display='flex';
        mostrarLoading(); carregarDados();
      },
    };

    init();
  })();
  </script>
</body>
</html>
